<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo">Flipkart</div>
        <input type="text" placeholder="Search for products">
        <button>Login</button>
    </header>

    <!-- Banner -->
    <section class="banner">
        <h1>Welcome to Flipkart</h1>
        <p>Best deals on electronics & fashion</p>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Product 1</h3>
            <p>₹999</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Product 2</h3>
            <p>₹1499</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Product 3</h3>
            <p>₹1999</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Product 4</h3>
            <p>₹799</p>
        </div>
    </section>

</body>
</html>
