<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="logo">Flipkart</div>
        <input type="text" placeholder="Search for products">
        <button>Login</button>
    </header>

    <!-- Banner -->
    <section class="banner">
        <h1>Welcome to Flipkart</h1>
        <p>Best deals on electronics & fashion</p>
    </section>

    <!-- Grab or Gone Section -->
    <section class="grab-section">
        <h2>Grab or gone</h2>
        <div class="products-grid">
            <div class="product-card">
                <img src="https://via.placeholder.com/200x200?text=Watch" alt="Big Savings">
                <div class="card-content">
                    <p class="card-title">Big Savings</p>
                    <p class="card-price">From ₹99</p>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/200x200?text=Bottle" alt="Milton, Cello & more">
                <div class="card-content">
                    <p class="card-title">Milton, Cello & more</p>
                    <p class="card-price">From ₹129</p>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/200x200?text=Watches" alt="Watches">
                <div class="card-content">
                    <p class="card-title">Watches</p>
                    <p class="card-price">Upto 70% off</p>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/200x200?text=Shoes" alt="Men's shoes">
                <div class="card-content">
                    <p class="card-title">Men's shoes</p>
                    <p class="card-price">Min 50% Off</p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
